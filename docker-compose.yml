services:
  papermate:
    build: .
    container_name: papermate
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8501:8501"
    command: >
      streamlit run app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
